<aside class="site-sidebar">
  <div class="sidebar-card profile">
    <div class="sidebar-name"><a class="sidebar-home-link" href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
    <p class="sidebar-bio">{{ site.description }}</p>
    <ul class="sidebar-meta">
      {% if site.sidebar.location %}<li>🗺️ <a href="https://maps.google.com/?q={{ site.sidebar.location | uri_escape }}" target="_blank" rel="noopener">{{ site.sidebar.location }}</a></li>{% endif %}
      {% if site.sidebar.github %}<li>
        <span class="icon github-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
          </svg>
        </span>
        <a href="{{ site.sidebar.github }}" target="_blank" rel="noopener">GitHub</a>
      </li>{% endif %}
      {% if site.sidebar.email %}<li>📨 <a href="{{ site.sidebar.email }}">Email</a></li>{% endif %}
    </ul>
  </div>

  <div class="sidebar-card categories">
    <div class="sidebar-section-title">카테고리</div>
    <ul class="sidebar-category-list">
      <li><a href="{{ '/paper-review/' | relative_url }}">논문리뷰</a></li>
      <li><a href="{{ '/movie/' | relative_url }}">영화</a></li>
      <li><a href="{{ '/music/' | relative_url }}">음악</a></li>
      <li><a href="{{ '/travel/' | relative_url }}">여행</a></li>
    </ul>
  </div>
</aside>
